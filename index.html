<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Medical Record Tracker</title>

  <!-- Mempercepat koneksi awal ke server Google -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Web App Manifest untuk fitur "Install app" di Android Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F3864">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Ikon untuk Add to Home Screen -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Supaya tampil fullscreen tanpa address bar di iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Medical Record">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #1F3864;
    }
    iframe {
      width: 100%;
      /* PENTING: 100dvh (dynamic viewport height), BUKAN 100% atau 100vh - inilah yang
         terbukti bekerja benar di Bucinton, karena dvh menyesuaikan otomatis terhadap
         perubahan tinggi viewport mobile (toolbar Safari muncul/hilang), sementara % dan vh
         biasa punya banyak masalah lama di mobile Safari. Tinggi safe area atas (status bar)
         dikurangkan, BUKAN ditambahkan - percobaan sebelumnya menambah tinggi ekstra malah
         merusak tampilan.
         Iframe di sini juga SENGAJA sebagai elemen normal (bukan position:fixed) mengikuti
         alur dokumen biasa - html/body diberi overflow:auto supaya halaman bisa discroll
         secara wajar kalau diperlukan. */
      height: calc(100dvh - env(safe-area-inset-top, 20px));
      border: none;
      display: block;
    }
    /* Splash screen - tampil sejak detik pertama, disembunyikan setelah app di dalam iframe
       mengirim sinyal "siap" (bukan cuma menunggu iframe "termuat" - iframe bisa saja sudah
       termuat tapi app di dalamnya belum selesai memuat data pasien). */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #1F3864;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.3s ease;
    }
    #splashScreen div {
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="splashScreen">
    <div>🏥 Medical Record Tracker</div>
    <div style="font-size:13px; font-weight:400; opacity:0.8;">Loading…</div>
  </div>

  <!-- GANTI URL DI BAWAH INI dengan URL Deploy Apps Script Anda (harus diakhiri /exec) -->
  <iframe src="https://script.google.com/macros/s/AKfycbxG1sVU7y0HmJb1snjCcTWButkMcvGsvA_JCGciQpPlgnNJ5Wzce2U7E40okKoCJ-kh/exec"></iframe>

  <script>
    let splashHidden = false;
    function hideSplash() {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splashScreen');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.style.display = 'none'; }, 300);
    }

    // Dengarkan sinyal "siap" dari app di dalam iframe (dikirim FormMed.html setelah data
    // pasien pertama selesai dimuat) - kalau app belum mengirim sinyal ini (versi lama belum
    // diperbarui, atau gagal), splash tetap disembunyikan setelah 10 detik lewat timeout di
    // bawah supaya tidak tersangkut selamanya.
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'medRecordReady') hideSplash();
    });
    setTimeout(hideSplash, 10000);
  </script>
</body>
</html>
